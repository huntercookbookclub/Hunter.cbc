<!--
  Supabase → Authentication → Emails → Templates → "Reset Password" → Source.
  Subject: Your CookBook Club password reset code
  {{ .Token }} is replaced with the code. Email apps don't support modern CSS
  (no OKLCH, no stylesheets), so everything is inline hex + tables.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fdeef2;padding:32px 12px;font-family:'Trebuchet MS',Arial,Helvetica,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:460px;background:#ffffff;border:3px solid #ffc6de;border-radius:24px;">
        <tr>
          <td align="center" style="padding:32px 28px 8px;">
            <img src="https://cookbookclub.nyc/email-logo.jpg" width="96" height="96" alt="CookBook Club" style="display:block;width:96px;height:96px;border-radius:50%;border:4px solid #ffc6de;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:12px 28px 0;">
            <h1 style="margin:0;font-size:26px;line-height:1.2;color:#da0d1b;">Reset your password</h1>
            <p style="margin:12px 0 0;font-size:16px;line-height:1.5;color:#3a2f33;">
              Here’s your one-time code:
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 28px;">
            <div style="display:inline-block;padding:16px 28px;background:#fff5fa;border:2px dashed #ff8fb8;border-radius:16px;font-family:'Courier New',Courier,monospace;font-size:34px;font-weight:bold;letter-spacing:8px;color:#1a1a1a;">
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 28px 28px;">
            <p style="margin:0;font-size:15px;line-height:1.5;color:#3a2f33;">
              Enter it on <a href="https://cookbookclub.nyc" style="color:#da0d1b;font-weight:bold;text-decoration:none;">cookbookclub.nyc</a>
              along with your new password.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:16px 28px 24px;border-top:1px solid #fbe0ea;">
            <p style="margin:0;font-size:12px;line-height:1.5;color:#8a7a80;">
              Didn’t ask for this? You can ignore this email; your password won’t change.<br />CookBook Club
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
